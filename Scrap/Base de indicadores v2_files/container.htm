.attribution {
  background-color: #F0F3FA;
  border-radius: 3px;
  bottom: 0px;
  font-size: 11px;
  padding: 0px 6px;

  right: 0px;

.body {

  margin-bottom: 20px;
}

.body a {
  clear: both;
  color: #131722;
  text-decoration: none;

	line-height: 24px;
  font-weight: 600;
  font-style: normal;
}

  text-decoration: none;
}

.image {
  display: flex;
  width: 100%;
  margin: 0 0 6px;
}

.image img {
  height: 100%;
  width: 100%;
  border-radius: 8px;
}

.image .image-link {
  height: 100%;
  width: 100%;
  aspect-ratio: 16 / 9;
}

.logo {
  float: left;
  width: 28px;
  height: 28px;
  margin-right: 12px;
}

.logo img {
  width: 100%;
  height: 100%;
}

.advertiser {
  margin: 8px 0 16px;
  line-height: 18px;
  font-size: 14px;
}

.advertiser-link {
  text-decoration: none;
  color: #131722;
}
